name: Publish KMedia Wasm Engine 0.4.0-alpha.2

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-kmedia-wasm-engine-0.4.0-alpha.2
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout verified engine commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Shusek/kmedia-wasm-engine
          ref: e987627c9ab21672f27f9080125d4cf63491747f
          path: engine
          persist-credentials: false

      - name: Verify immutable source revision
        working-directory: engine
        shell: bash
        run: |
          set -euo pipefail
          expected=e987627c9ab21672f27f9080125d4cf63491747f
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected" || {
            echo "Unexpected engine revision: $actual" >&2
            exit 1
          }

      - name: Set up JDK 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
          cache-dependency-path: |
            engine/**/*.gradle*
            engine/gradle/libs.versions.toml
            engine/gradle/wrapper/gradle-wrapper.properties

      - name: Require release credentials
        shell: bash
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
          MAVEN_SIGNING_PASSWORD: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$MAVEN_CENTRAL_USERNAME" ]] || missing+=(MAVEN_CENTRAL_USERNAME)
          [[ -n "$MAVEN_CENTRAL_PASSWORD" ]] || missing+=(MAVEN_CENTRAL_PASSWORD)
          [[ -n "$MAVEN_SIGNING_KEY" ]] || missing+=(MAVEN_SIGNING_KEY)
          [[ -n "$MAVEN_SIGNING_PASSWORD" ]] || missing+=(MAVEN_SIGNING_PASSWORD)
          if (( ${#missing[@]} > 0 )); then
            echo "Missing required repository secrets: ${missing[*]}" >&2
            exit 1
          fi

      - name: Verify and publish immutable engine release
        working-directory: engine
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
        run: >-
          ./gradlew
          check
          :player:publishAndReleaseToMavenCentral
          :runtime-assets:publishAndReleaseToMavenCentral
          -PpublicationVersion=0.4.0-alpha.2
          -PreleaseSigningEnabled=true
          --no-configuration-cache
          --no-daemon
