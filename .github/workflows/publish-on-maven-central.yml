name: Release Maven Artifacts

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: maven-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/build-test.yml

  shared-runtime-consumer:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Install Android NDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager | sort | tail -n 1)"
          fi
          "$SDKMANAGER" "ndk;29.0.14206865"
      - name: Install Rust Android targets
        run: rustup target add armv7-linux-androideabi aarch64-linux-android
      - name: Build a consumer with both public backends and verify one shared graph
        run: >-
          ./gradlew --no-daemon
          :androidApp:verifyAndroidArmNativeMatrix
          :androidApp:verifyAndroidArmNativeBundle
          --refresh-dependencies
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: shared-runtime-graph-${{ github.sha }}
          path: androidApp/build/reports/native-graph/
          if-no-files-found: error

  release:
    needs: [verify, shared-runtime-consumer]
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate immutable SemVer tag
        id: release_version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ "$GITHUB_REF_NAME" != "v$version" || ! "$version" =~ $semver ]]; then
            echo "Release tags must use immutable SemVer, for example v1.2.3." >&2
            exit 1
          fi
          if [[ ! "$version" =~ ^4\.0\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "This workflow publishes the KMediaPlayer 4.0 line, including immutable RC tags." >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Require Maven Central credentials
        shell: bash
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
          MAVEN_SIGNING_PASSWORD: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$MAVEN_CENTRAL_USERNAME" ]] || missing+=(MAVEN_CENTRAL_USERNAME)
          [[ -n "$MAVEN_CENTRAL_PASSWORD" ]] || missing+=(MAVEN_CENTRAL_PASSWORD)
          [[ -n "$MAVEN_SIGNING_KEY" ]] || missing+=(MAVEN_SIGNING_KEY)
          [[ -n "$MAVEN_SIGNING_PASSWORD" ]] || missing+=(MAVEN_SIGNING_PASSWORD)
          if (( ${#missing[@]} > 0 )); then
            echo "Missing required repository secrets: ${missing[*]}" >&2
            exit 1
          fi

      - name: Download verified native libraries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: mediaplayer/src/jvmMain/resources/composemediaplayer/native/
          pattern: native-*-${{ github.sha }}
          merge-multiple: true

      - name: Download verified JVM libdovi libraries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: mediaplayer-dolbyvision/src/jvmMain/resources/
          pattern: libdovi-jvm-*-${{ github.sha }}
          merge-multiple: true

      - name: Download verified Apple ASS payloads
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: mediaplayer-ass/build/
          pattern: apple-ass-${{ github.sha }}

      - name: Download verified Apple MPV pod graph
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: mediaplayer-mpv/build/
          pattern: apple-mpv-${{ github.sha }}

      - name: Verify complete native payload
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            darwin-arm64/libNativeVideoPlayer.dylib
            linux-x86-64/libNativeVideoPlayer.so
            linux-aarch64/libNativeVideoPlayer.so
            linux-x86-64/libKMediaPlayerVulkanProjection.so
            linux-aarch64/libKMediaPlayerVulkanProjection.so
            win32-x86-64/NativeVideoPlayer.dll
            win32-arm64/NativeVideoPlayer.dll
          )
          for relative_path in "${expected[@]}"; do
            path="mediaplayer/src/jvmMain/resources/composemediaplayer/native/$relative_path"
            test -s "$path" || { echo "Missing native payload: $path" >&2; exit 1; }
          done

          libdovi_expected=(
            darwin-aarch64/libcomposemediaplayer_dovi.dylib
            linux-x86-64/libcomposemediaplayer_dovi.so
            linux-aarch64/libcomposemediaplayer_dovi.so
            windows-x86-64/composemediaplayer_dovi.dll
            windows-aarch64/composemediaplayer_dovi.dll
          )
          for relative_path in "${libdovi_expected[@]}"; do
            path="mediaplayer-dolbyvision/src/jvmMain/resources/composemediaplayer/dolbyvision/native/$relative_path"
            test -s "$path" || { echo "Missing libdovi payload: $path" >&2; exit 1; }
          done

          test ! -e mediaplayer/src/jvmMain/resources/composemediaplayer/native/darwin-x86-64
          test ! -e mediaplayer-dolbyvision/src/jvmMain/resources/composemediaplayer/dolbyvision/native/darwin-x86-64

          bash .github/scripts/verify_apple_ass_payload.sh
          bash .github/scripts/verify_apple_mpv_payload.sh

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '25'
          distribution: temurin
          cache: gradle

      - name: Verify Xcode 26.3 and iOS 26 SDK
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "$DEVELOPER_DIR" ]; then
            echo "Xcode 26.3 is required by the current Compose UIKit artifacts." >&2
            exit 1
          fi
          xcodebuild -version
          sdk_version="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          echo "iOS Simulator SDK $sdk_version"
          case "$sdk_version" in
            26.*) ;;
            *) echo "An iOS 26 Simulator SDK is required." >&2; exit 1 ;;
          esac

      - name: Install Android NDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager | sort | tail -n 1)"
          fi
          "$SDKMANAGER" "ndk;29.0.14206865"

      - name: Install Rust targets for Android and Apple artifacts
        run: >-
          rustup target add armv7-linux-androideabi aarch64-linux-android
          aarch64-apple-ios aarch64-apple-ios-sim wasm32-unknown-unknown

      - name: Build and stage the Maven Central release
        shell: bash
        run: >-
          ./gradlew :mediaplayer-core:publishAllPublicationsToReleaseStagingRepository
          :mediaplayer-extension-api:publishAllPublicationsToReleaseStagingRepository
          :mediaplayer-desktop-window:publishAllPublicationsToReleaseStagingRepository
          :mediaplayer:publishAllPublicationsToReleaseStagingRepository
          :mediaplayer-mpv:publishAllPublicationsToReleaseStagingRepository
          :mediaplayer-ass:publishAllPublicationsToReleaseStagingRepository
          :mediaplayer-dolbyvision:publishAllPublicationsToReleaseStagingRepository
          :mediaplayer-kmediabridge:publishAllPublicationsToReleaseStagingRepository
          :mediaplayer-core:verifyJvm25Bytecode
          :mediaplayer-desktop-window:verifyJvm25Bytecode
          :mediaplayer:verifyJvm25Bytecode
          :mediaplayer-mpv:verifyJvm25Bytecode
          -PpublicationVersion="$RELEASE_VERSION"
          -PreleaseStagingMavenRepository="$RUNNER_TEMP/maven-staging"
          -PcomposeMediaPlayer.skipNativeBuild=true
          -PcomposeMediaPlayer.skipMpvAppleNativeBuild=false
          -PcomposeMediaPlayer.skipLibDoviNativeBuild=false
          --refresh-dependencies --no-configuration-cache --no-daemon

      - name: Verify staged Maven coordinates
        shell: bash
        run: |
          set -euo pipefail
          repository="$RUNNER_TEMP/maven-staging"
          test -d "$repository/io/github/shusek"
          if find "$repository" -type f -path '*/dev/*' -print -quit | grep -q .; then
            echo "Mutable dev paths were found in release staging." >&2
            exit 1
          fi
          if grep -R -n -E '<version>dev</version>|"version"[[:space:]]*:[[:space:]]*"dev"' "$repository"; then
            echo "Mutable dev coordinates were found in release staging." >&2
            exit 1
          fi
          found=0
          while IFS= read -r pom; do
            grep -Fq "<version>$RELEASE_VERSION</version>" "$pom" || {
              echo "Unexpected project version in $pom" >&2
              exit 1
            }
            found=$((found + 1))
          done < <(find "$repository/io/github/shusek" -path "*/$RELEASE_VERSION/*.pom" -type f)
          test "$found" -gt 0 || { echo "No staged POMs for $RELEASE_VERSION" >&2; exit 1; }
          python3 .github/scripts/verify_maven_poms.py "$repository" "$RELEASE_VERSION"

          expected_coordinates=(
            composemediaplayer-core
            composemediaplayer-desktop-window
            composemediaplayer-desktop-window-jvm
            composemediaplayer
            composemediaplayer-mpv
            composemediaplayer-mpv-iosarm64
            composemediaplayer-mpv-iossimulatorarm64
          )
          for artifact_id in "${expected_coordinates[@]}"; do
            pom="$repository/io/github/shusek/$artifact_id/$RELEASE_VERSION/$artifact_id-$RELEASE_VERSION.pom"
            test -s "$pom" || { echo "Missing staged coordinate: io.github.shusek:$artifact_id:$RELEASE_VERSION" >&2; exit 1; }
          done

          mpv_artifacts=(
            composemediaplayer-mpv
            composemediaplayer-mpv-android
            composemediaplayer-mpv-iosarm64
            composemediaplayer-mpv-iossimulatorarm64
            composemediaplayer-mpv-jvm
          )
          for artifact in "${mpv_artifacts[@]}"; do
            pom="$repository/io/github/shusek/$artifact/$RELEASE_VERSION/$artifact-$RELEASE_VERSION.pom"
            test -s "$pom" || { echo "Missing staged MPV coordinate: $artifact:$RELEASE_VERSION" >&2; exit 1; }
          done

          extension_api_artifacts=(
            composemediaplayer-extension-api
            composemediaplayer-extension-api-android
            composemediaplayer-extension-api-jvm
          )
          for artifact in "${extension_api_artifacts[@]}"; do
            pom="$repository/io/github/shusek/$artifact/$RELEASE_VERSION/$artifact-$RELEASE_VERSION.pom"
            test -s "$pom" || {
              echo "Missing staged extension API coordinate: $artifact:$RELEASE_VERSION" >&2
              exit 1
            }
          done

          ass_artifacts=(
            composemediaplayer-ass
            composemediaplayer-ass-android
            composemediaplayer-ass-iosarm64
            composemediaplayer-ass-iossimulatorarm64
            composemediaplayer-ass-jvm
          )
          for artifact in "${ass_artifacts[@]}"; do
            pom="$repository/io/github/shusek/$artifact/$RELEASE_VERSION/$artifact-$RELEASE_VERSION.pom"
            test -s "$pom" || { echo "Missing staged ASS coordinate: $artifact:$RELEASE_VERSION" >&2; exit 1; }
          done
          dolby_vision_artifacts=(
            composemediaplayer-dolbyvision
            composemediaplayer-dolbyvision-android
            composemediaplayer-dolbyvision-jvm
          )
          for artifact in "${dolby_vision_artifacts[@]}"; do
            pom="$repository/io/github/shusek/$artifact/$RELEASE_VERSION/$artifact-$RELEASE_VERSION.pom"
            test -s "$pom" || {
              echo "Missing staged Dolby Vision coordinate: $artifact:$RELEASE_VERSION" >&2
              exit 1
            }
          done

          kmedia_bridge_artifacts=(
            composemediaplayer-kmediabridge
            composemediaplayer-kmediabridge-android
            composemediaplayer-kmediabridge-jvm
          )
          for artifact in "${kmedia_bridge_artifacts[@]}"; do
            pom="$repository/io/github/shusek/$artifact/$RELEASE_VERSION/$artifact-$RELEASE_VERSION.pom"
            test -s "$pom" || {
              echo "Missing staged KMediaBridge coordinate: $artifact:$RELEASE_VERSION" >&2
              exit 1
            }
          done

      - name: Publish the verified release to Maven Central
        shell: bash
        run: >-
          ./gradlew :mediaplayer-core:publishAndReleaseToMavenCentral
          :mediaplayer-extension-api:publishAndReleaseToMavenCentral
          :mediaplayer-desktop-window:publishAndReleaseToMavenCentral
          :mediaplayer:publishAndReleaseToMavenCentral
          :mediaplayer-mpv:publishAndReleaseToMavenCentral
          :mediaplayer-ass:publishAndReleaseToMavenCentral
          :mediaplayer-dolbyvision:publishAndReleaseToMavenCentral
          :mediaplayer-kmediabridge:publishAndReleaseToMavenCentral
          -PpublicationVersion="$RELEASE_VERSION"
          -PreleaseSigningEnabled=true
          -PcomposeMediaPlayer.skipNativeBuild=true
          -PcomposeMediaPlayer.skipMpvAppleNativeBuild=false
          -PcomposeMediaPlayer.skipLibDoviNativeBuild=false
          --refresh-dependencies --no-configuration-cache --no-daemon
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_PASSWORD }}

      - name: Wait for Maven Central publication
        shell: bash
        run: .github/scripts/verify_maven_central_release.sh "$RELEASE_VERSION"
