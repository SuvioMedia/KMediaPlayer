name: Build Native Libraries

on:
  workflow_call:

jobs:
  windows:
    runs-on: windows-2025
    steps:
      - name: Checkout Repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Build Windows native DLLs
        shell: cmd
        working-directory: mediaplayer/src/jvmMain/native/windows
        run: call build.bat
        env:
          NATIVE_LIBS_OUTPUT_DIR: ${{ github.workspace }}/build/nativeLibs

      - name: Verify Windows natives
        shell: bash
        run: |
          for f in \
            build/nativeLibs/win32-x86-64/NativeVideoPlayer.dll \
            build/nativeLibs/win32-arm64/NativeVideoPlayer.dll; do
            if [ ! -f "$f" ]; then echo "MISSING: $f" >&2; exit 1; fi
            echo "OK: $f ($(wc -c < "$f") bytes)"
          done

      - name: Build JVM libdovi payloads for Windows
        shell: bash
        run: |
          set -euo pipefail
          rustup target add x86_64-pc-windows-msvc aarch64-pc-windows-msvc
          manifest="mediaplayer-dolbyvision/native/libdovi/Cargo.toml"
          cargo build --release --locked --manifest-path "$manifest" --target x86_64-pc-windows-msvc
          cargo build --release --locked --manifest-path "$manifest" --target aarch64-pc-windows-msvc
          root="mediaplayer-dolbyvision/native/libdovi"
          output="build/libdoviJvmResources/composemediaplayer/dolbyvision/native"
          mkdir -p "$output/windows-x86-64" "$output/windows-aarch64"
          cp "$root/target/x86_64-pc-windows-msvc/release/composemediaplayer_libdovi.dll" \
            "$output/windows-x86-64/composemediaplayer_dovi.dll"
          cp "$root/target/aarch64-pc-windows-msvc/release/composemediaplayer_libdovi.dll" \
            "$output/windows-aarch64/composemediaplayer_dovi.dll"

      - name: Upload Windows natives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-windows-${{ github.sha }}
          path: build/nativeLibs/
          retention-days: 1

      - name: Upload Windows JVM libdovi payloads
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: libdovi-jvm-windows-${{ github.sha }}
          path: build/libdoviJvmResources/
          if-no-files-found: error
          retention-days: 1

  macos:
    runs-on: macos-15
    steps:
      - name: Checkout Repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Download and verify the exact KMediaAssRuntime Apple SDKs
        env:
          GH_TOKEN: ${{ github.token }}
          ASS_RUNTIME_VERSION: 0.1.0-rc.3
        run: |
          set -euo pipefail
          download="$RUNNER_TEMP/kmedia-ass-download"
          targets="$GITHUB_WORKSPACE/mediaplayer-ass/build/kmediaAssRuntimeAppleOutputs"
          mkdir -p "$download" "$targets"
          gh release download "v$ASS_RUNTIME_VERSION" \
            --repo Shusek/KMediaFfmpegRuntime \
            --dir "$download" \
            --pattern SHA256SUMS \
            --pattern KMediaAssRuntime.podspec \
            --pattern "kmedia-ass-runtime-$ASS_RUNTIME_VERSION-apple-xcframeworks.zip" \
            --pattern "kmedia-ass-runtime-$ASS_RUNTIME_VERSION-ios-arm64-sdk.tar.gz" \
            --pattern "kmedia-ass-runtime-$ASS_RUNTIME_VERSION-ios-simulator-arm64-sdk.tar.gz"
          for target in ios-arm64 ios-simulator-arm64; do
            name="kmedia-ass-runtime-$ASS_RUNTIME_VERSION-$target-sdk.tar.gz"
            expected="$(awk -v p="$name" '$2 == p || $2 == "./" p {print $1}' "$download/SHA256SUMS")"
            [[ "$expected" =~ ^[0-9a-f]{64}$ ]]
            test "$expected" = "$(shasum -a 256 "$download/$name" | awk '{print $1}')"
            mkdir "$targets/$target"
            tar -xzf "$download/$name" -C "$targets/$target"
            test -f "$targets/$target/sdk/$target/include/ass/ass.h"
            test "$(cat "$targets/$target/ass-runtime-id.txt")" = \
              "kmediaass-0.17.5-36443523f0148567"
          done
          apple_archive="kmedia-ass-runtime-$ASS_RUNTIME_VERSION-apple-xcframeworks.zip"
          for name in "$apple_archive" KMediaAssRuntime.podspec; do
            expected="$(awk -v p="$name" '$2 == p || $2 == "./" p {print $1}' "$download/SHA256SUMS")"
            [[ "$expected" =~ ^[0-9a-f]{64}$ ]]
            test "$expected" = "$(shasum -a 256 "$download/$name" | awk '{print $1}')"
          done
          pod_root="$GITHUB_WORKSPACE/mediaplayer-ass/build/kmediaAssRuntimePod"
          mkdir "$pod_root"
          ditto -x -k "$download/$apple_archive" "$pod_root"
          cp "$download/KMediaAssRuntime.podspec" "$pod_root/"
          echo "KMEDIA_ASS_RUNTIME_TARGETS=$targets" >> "$GITHUB_ENV"

      - name: Build thin iOS ASS clients
        run: >-
          ./gradlew :mediaplayer-ass:buildIosArm64AppleAss
          :mediaplayer-ass:buildIosSimulatorArm64AppleAss
          -PkmediaAssRuntimeAppleOutputs="$KMEDIA_ASS_RUNTIME_TARGETS"
          --no-daemon

      - name: Verify thin Apple ASS clients
        run: bash .github/scripts/verify_apple_ass_payload.sh

      - name: Download and verify the exact KMediaMpv Apple pod graph
        env:
          GH_TOKEN: ${{ github.token }}
          MPV_VERSION: 0.3.0-rc.4
          RUNTIME_VERSION: 0.1.0-rc.3
        run: |
          set -euo pipefail
          mpv_download="$RUNNER_TEMP/kmedia-mpv-download"
          runtime_download="$RUNNER_TEMP/kmedia-mpv-runtime-download"
          mpv_pod="$GITHUB_WORKSPACE/mediaplayer-mpv/build/kmediaMpvPod"
          ffmpeg_pod="$GITHUB_WORKSPACE/mediaplayer-mpv/build/kmediaFfmpegRuntimePod"
          ass_pod="$GITHUB_WORKSPACE/mediaplayer-mpv/build/kmediaAssRuntimePod"
          mkdir -p "$mpv_download" "$runtime_download" "$mpv_pod" "$ffmpeg_pod" "$ass_pod"

          gh release download "v$MPV_VERSION" \
            --repo Shusek/KMediaMpv \
            --dir "$mpv_download" \
            --pattern SHA256SUMS \
            --pattern KMediaMpv.podspec \
            --pattern "kmedia-mpv-$MPV_VERSION-apple-xcframeworks.zip"
          mpv_archive="kmedia-mpv-$MPV_VERSION-apple-xcframeworks.zip"
          for name in "$mpv_archive" KMediaMpv.podspec; do
            expected="$(awk -v p="$name" '$2 == p || $2 == "./" p {print $1}' "$mpv_download/SHA256SUMS")"
            [[ "$expected" =~ ^[0-9a-f]{64}$ ]]
            test "$expected" = "$(shasum -a 256 "$mpv_download/$name" | awk '{print $1}')"
          done
          ditto -x -k "$mpv_download/$mpv_archive" "$mpv_pod"
          cp "$mpv_download/KMediaMpv.podspec" "$mpv_pod/"

          gh release download "v$RUNTIME_VERSION" \
            --repo Shusek/KMediaFfmpegRuntime \
            --dir "$runtime_download" \
            --pattern SHA256SUMS \
            --pattern KMediaAssRuntime.podspec \
            --pattern KMediaFfmpegRuntime.podspec \
            --pattern "kmedia-ass-runtime-$RUNTIME_VERSION-apple-xcframeworks.zip" \
            --pattern "kmedia-ffmpeg-runtime-$RUNTIME_VERSION-apple-xcframeworks.zip"
          for component in ass ffmpeg; do
            archive="kmedia-$component-runtime-$RUNTIME_VERSION-apple-xcframeworks.zip"
            podspec="KMedia$(tr '[:lower:]' '[:upper:]' <<< "${component:0:1}")${component:1}Runtime.podspec"
            expected="$(awk -v p="$archive" '$2 == p || $2 == "./" p {print $1}' "$runtime_download/SHA256SUMS")"
            [[ "$expected" =~ ^[0-9a-f]{64}$ ]]
            test "$expected" = "$(shasum -a 256 "$runtime_download/$archive" | awk '{print $1}')"
            expected="$(awk -v p="$podspec" '$2 == p || $2 == "./" p {print $1}' "$runtime_download/SHA256SUMS")"
            [[ "$expected" =~ ^[0-9a-f]{64}$ ]]
            test "$expected" = "$(shasum -a 256 "$runtime_download/$podspec" | awk '{print $1}')"
            if [ "$component" = ass ]; then destination="$ass_pod"; else destination="$ffmpeg_pod"; fi
            ditto -x -k "$runtime_download/$archive" "$destination"
            cp "$runtime_download/$podspec" "$destination/"
          done

          grep -F "spec.dependency 'KMediaFfmpegRuntime', '= $RUNTIME_VERSION'" \
            "$mpv_pod/KMediaMpv.podspec"
          grep -F "spec.dependency           'KMediaAssRuntime', '= $RUNTIME_VERSION'" \
            "$ffmpeg_pod/KMediaFfmpegRuntime.podspec"
          bash .github/scripts/verify_apple_mpv_payload.sh

      - name: Build macOS native dylibs
        run: bash mediaplayer/src/jvmMain/native/macos/build.sh
        env:
          NATIVE_LIBS_OUTPUT_DIR: ${{ github.workspace }}/build/nativeLibs

      - name: Verify macOS natives
        run: |
          f=build/nativeLibs/darwin-arm64/libNativeVideoPlayer.dylib
          if [ ! -f "$f" ]; then echo "MISSING: $f" >&2; exit 1; fi
          echo "OK: $f ($(wc -c < "$f") bytes)"
          test ! -e build/nativeLibs/darwin-x86-64

      - name: Build JVM libdovi payloads for macOS
        run: |
          set -euo pipefail
          rustup target add aarch64-apple-darwin
          manifest="mediaplayer-dolbyvision/native/libdovi/Cargo.toml"
          cargo build --release --locked --manifest-path "$manifest" --target aarch64-apple-darwin
          root="mediaplayer-dolbyvision/native/libdovi"
          output="build/libdoviJvmResources/composemediaplayer/dolbyvision/native"
          mkdir -p "$output/darwin-aarch64"
          cp "$root/target/aarch64-apple-darwin/release/libcomposemediaplayer_libdovi.dylib" \
            "$output/darwin-aarch64/libcomposemediaplayer_dovi.dylib"
          test ! -e "$output/darwin-x86-64"

      - name: Upload macOS natives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-macos-${{ github.sha }}
          path: build/nativeLibs/
          retention-days: 1

      - name: Upload macOS JVM libdovi payloads
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: libdovi-jvm-macos-${{ github.sha }}
          path: build/libdoviJvmResources/
          if-no-files-found: error
          retention-days: 1

      - name: Upload Apple ASS payloads
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: apple-ass-${{ github.sha }}
          path: |
            mediaplayer-ass/build/generated/appleAssIos/
            mediaplayer-ass/build/kmediaAssRuntimeAppleOutputs/
            mediaplayer-ass/build/kmediaAssRuntimePod/
          if-no-files-found: error
          retention-days: 1

      - name: Upload Apple MPV pod graph
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: apple-mpv-${{ github.sha }}
          path: |
            mediaplayer-mpv/build/kmediaMpvPod/
            mediaplayer-mpv/build/kmediaFfmpegRuntimePod/
            mediaplayer-mpv/build/kmediaAssRuntimePod/
          if-no-files-found: error
          retention-days: 1

  linux:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86-64
            rust-target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            arch: aarch64
            rust-target: aarch64-unknown-linux-gnu
    steps:
      - name: Checkout Repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Install GStreamer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            build-essential \
            curl \
            libfontconfig1-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libtool \
            libwayland-dev \
            libvulkan-dev \
            meson \
            nasm \
            ninja-build \
            patchelf \
            pkg-config \
            xz-utils \
            glslc \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-tools \
            libgtk-3-0 \
            weston \
            xvfb

      - name: Build Linux native library
        working-directory: mediaplayer/src/jvmMain/native/linux
        run: bash build.sh
        env:
          NATIVE_LIBS_OUTPUT_DIR: ${{ github.workspace }}/build/nativeLibs

      - name: Verify Linux natives
        run: |
          test -f build/nativeLibs/linux-${{ matrix.arch }}/libNativeVideoPlayer.so
          test -f build/nativeLibs/linux-${{ matrix.arch }}/libKMediaPlayerVulkanProjection.so
          ls -la build/nativeLibs/linux-${{ matrix.arch }}/

      - name: Verify actual GStreamer decoder reporting
        run: |
          read -r -a glib_cflags <<< "$(pkg-config --cflags glib-2.0)"
          read -r -a glib_libs <<< "$(pkg-config --libs glib-2.0)"
          gst-launch-1.0 -q \
            videotestsrc num-buffers=10 \
            ! video/x-raw,width=64,height=64,framerate=5/1 \
            ! vp8enc deadline=1 \
            ! webmmux \
            ! filesink location="$RUNNER_TEMP/decoder-smoke.webm"
          cc \
            -Wall -Wextra -Werror \
            -Wl,--allow-shlib-undefined \
            "${glib_cflags[@]}" \
            -Imediaplayer/src/jvmMain/native/linux \
            mediaplayer/src/jvmMain/native/linux/tests/NativeDecoderNameSmokeTest.c \
            -L"build/nativeLibs/linux-${{ matrix.arch }}" \
            -Wl,-rpath,"build/nativeLibs/linux-${{ matrix.arch }}" \
            -lNativeVideoPlayer \
            "${glib_libs[@]}" \
            -o "$RUNNER_TEMP/native-decoder-name-smoke"
          LD_LIBRARY_PATH="$JAVA_HOME/lib:$JAVA_HOME/lib/server:${LD_LIBRARY_PATH:-}" \
            "$RUNNER_TEMP/native-decoder-name-smoke" "$RUNNER_TEMP/decoder-smoke.webm"

      - name: Verify optional Vulkan renderer loading
        run: |
          cc \
            -Wall -Wextra -Werror \
            -Wl,--allow-shlib-undefined \
            -Imediaplayer/src/jvmMain/native/linux \
            mediaplayer/src/jvmMain/native/linux/tests/OptionalVulkanProjectionLoaderSmokeTest.c \
            -L"build/nativeLibs/linux-${{ matrix.arch }}" \
            -Wl,-rpath,"build/nativeLibs/linux-${{ matrix.arch }}" \
            -lNativeVideoPlayer \
            -ldl \
            -o "$RUNNER_TEMP/optional-vulkan-loader-smoke"
          LD_LIBRARY_PATH="$JAVA_HOME/lib:$JAVA_HOME/lib/server:${LD_LIBRARY_PATH:-}" \
            "$RUNNER_TEMP/optional-vulkan-loader-smoke" \
            "$GITHUB_WORKSPACE/build/nativeLibs/linux-${{ matrix.arch }}/libKMediaPlayerVulkanProjection.so"

      - name: Verify JBR WLToolkit surface and direct Wayland query
        run: bash mediaplayer/src/jvmMain/native/linux/tests/run_jbr_wayland_surface_smoke.sh

      - name: Build JVM libdovi payload for Linux
        run: |
          set -euo pipefail
          rustup target add '${{ matrix.rust-target }}'
          manifest="mediaplayer-dolbyvision/native/libdovi/Cargo.toml"
          cargo build --release --locked --manifest-path "$manifest" --target '${{ matrix.rust-target }}'
          root="mediaplayer-dolbyvision/native/libdovi"
          output="build/libdoviJvmResources/composemediaplayer/dolbyvision/native/linux-${{ matrix.arch }}"
          mkdir -p "$output"
          cp "$root/target/${{ matrix.rust-target }}/release/libcomposemediaplayer_libdovi.so" \
            "$output/libcomposemediaplayer_dovi.so"

      - name: Upload Linux library
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-linux-${{ matrix.arch }}-${{ github.sha }}
          path: build/nativeLibs/
          retention-days: 1

      - name: Upload Linux JVM libdovi payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: libdovi-jvm-linux-${{ matrix.arch }}-${{ github.sha }}
          path: build/libdoviJvmResources/
          if-no-files-found: error
          retention-days: 1
