name: Verify Maven Central Publication

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable version tag, for example v4.0.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: maven-central-verification-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  verify-maven-central:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 75
    steps:
      - name: Checkout current verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate immutable version tag
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ "$RELEASE_TAG" != "v$version" || ! "$version" =~ $semver ]]; then
            echo "Version tags must use immutable SemVer, for example v4.0.1." >&2
            exit 1
          fi
          local_sha="$(git rev-parse "$RELEASE_TAG^{commit}")"
          remote_sha="$(
            git ls-remote --tags origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}" |
              awk 'END { print $1 }'
          )"
          if [[ -z "$remote_sha" || "$local_sha" != "$remote_sha" ]]; then
            echo "The local version tag does not match the remote version tag." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          java-version: '25'
          distribution: temurin
          cache: gradle

      - name: Wait for Maven Central publication
        shell: bash
        run: .github/scripts/verify_maven_central_release.sh "${{ steps.release.outputs.version }}"
