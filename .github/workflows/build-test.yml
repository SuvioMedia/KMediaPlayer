name: Build and Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-natives:
    uses: ./.github/workflows/build-natives.yml

  jvm:
    needs: build-natives
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download all native libraries
        uses: actions/download-artifact@v8
        with:
          path: mediaplayer/src/jvmMain/resources/composemediaplayer/native/
          pattern: native-*
          merge-multiple: true

      - name: Verify natives
        run: |
          for f in \
            linux-x86-64/libNativeVideoPlayer.so \
            linux-aarch64/libNativeVideoPlayer.so \
            darwin-aarch64/libNativeVideoPlayer.dylib \
            darwin-x86-64/libNativeVideoPlayer.dylib \
            win32-x86-64/NativeVideoPlayer.dll \
            win32-arm64/NativeVideoPlayer.dll; do
            path="mediaplayer/src/jvmMain/resources/composemediaplayer/native/$f"
            if [ ! -f "$path" ]; then echo "MISSING: $path" >&2; exit 1; fi
            echo "OK: $path"
          done

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Install GStreamer runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgstreamer1.0-0 \
            libgstreamer-plugins-base1.0-0 \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good

      - name: Build and test JVM
        run: ./gradlew :mediaplayer:compileKotlinJvm :mediaplayer:jvmTest --no-daemon --continue
        env:
          COMPOSE_MEDIA_PLAYER_SKIP_NATIVE_BUILD: 'true'

      - name: Upload test reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports-jvm
          path: '**/build/reports/tests/'

  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Install Android NDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager | sort | tail -n 1)"
          fi
          "$SDKMANAGER" "ndk;29.0.14206865"

      - name: Build Android
        run: ./gradlew :mediaplayer:compileAndroidMain :mediaplayer:testAndroidHostTest :androidApp:assembleDebug --no-daemon --continue

      - name: Upload test reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports-android
          path: '**/build/reports/tests/'

  ios:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Build iOS
        run: ./gradlew :mediaplayer:compileKotlinIosArm64 :mediaplayer:compileKotlinIosSimulatorArm64 --no-daemon

  wasmJs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Build WASM
        run: ./gradlew :mediaplayer:compileKotlinWasmJs --no-daemon

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Run ktlint and detekt
        run: ./gradlew ktlintCheck detekt --no-daemon --continue
