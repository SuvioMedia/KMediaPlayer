name: Build and Test

on:
  workflow_call:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

concurrency:
  group: verification-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-natives:
    uses: ./.github/workflows/build-natives.yml

  jvm:
    needs: build-natives
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: linux
            gradle: ./gradlew
          - os: macos-15
            label: macos
            gradle: ./gradlew
          - os: windows-2025
            label: windows
            gradle: ./gradlew.bat
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download all native libraries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: mediaplayer/src/jvmMain/resources/composemediaplayer/native/
          pattern: native-*-${{ github.sha }}
          merge-multiple: true

      - name: Download all JVM libdovi libraries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: mediaplayer-dolbyvision/src/jvmMain/resources/
          pattern: libdovi-jvm-*-${{ github.sha }}
          merge-multiple: true

      - name: Download bundled Apple ASS payloads
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: mediaplayer-ass/build/generated/
          pattern: apple-ass-${{ github.sha }}

      - name: Download bundled Windows and Linux ASS payloads
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: mediaplayer-ass/build/generated/desktopAssJvmResources/
          pattern: desktop-ass-*-${{ github.sha }}
          merge-multiple: true

      - name: Set up JDK 25
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          java-version: '25'
          distribution: temurin
          cache: gradle

      - name: Install GStreamer runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgstreamer1.0-0 \
            libgstreamer-plugins-base1.0-0 \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good

      - name: Test desktop JVM on ${{ matrix.label }}
        run: >-
          ${{ matrix.gradle }} :mediaplayer-core:jvmTest
          :mediaplayer-extension-api:jvmTest
          :mediaplayer:compileKotlinJvm :mediaplayer:jvmTest
          :mediaplayer:verifyJvmMacArmNativeMatrix
          :mediaplayer-ass:jvmTest :mediaplayer-ass:verifyJvmMacArmNativeMatrix
          :mediaplayer-ass:verifyJvmDesktopNativeMatrix
          :mediaplayer-dolbyvision:jvmTest :mediaplayer-dolbyvision:verifyJvmMacArmNativeMatrix
          :mediaplayer-kmediabridge:jvmTest
          :mediaplayer-mpv:jvmTest
          --project-prop composeMediaPlayer.skipNativeBuild=true --no-daemon --continue

      - name: Upload JVM test reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: test-reports-jvm-${{ matrix.label }}
          path: |
            mediaplayer/build/reports/tests/
            mediaplayer/build/test-results/
            mediaplayer-extension-api/build/reports/tests/
            mediaplayer-extension-api/build/test-results/
            mediaplayer-ass/build/reports/tests/
            mediaplayer-ass/build/test-results/
            mediaplayer-dolbyvision/build/reports/tests/
            mediaplayer-dolbyvision/build/test-results/
            mediaplayer-core/build/reports/tests/
            mediaplayer-core/build/test-results/
            mediaplayer-mpv/build/reports/tests/
            mediaplayer-mpv/build/test-results/
          if-no-files-found: warn

  android:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up JDK 25
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          java-version: '25'
          distribution: temurin
          cache: gradle

      - name: Install Android NDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager | sort | tail -n 1)"
          fi
          "$SDKMANAGER" "ndk;29.0.14206865"

      - name: Install Rust Android targets
        run: rustup target add armv7-linux-androideabi aarch64-linux-android

      - name: Build and test Android
        run: >-
          ./gradlew :mediaplayer-core:compileAndroidMain
          :mediaplayer-core:testAndroidHostTest
          :mediaplayer-extension-api:compileAndroidMain
          :mediaplayer-extension-api:testAndroidHostTest
          :mediaplayer:compileAndroidMain :mediaplayer:testAndroidHostTest
          :mediaplayer:assembleAndroidDeviceTest
          :mediaplayer:verifyAndroidArmNativeMatrix
          :mediaplayer-ass:testAndroidHostTest :mediaplayer-ass:assembleAndroidDeviceTest
          :mediaplayer-ass:verifyAndroidAssAar
          :mediaplayer-dolbyvision:testAndroidHostTest
          :mediaplayer-dolbyvision:verifyAndroidArmNativeMatrix
          :mediaplayer-kmediabridge:testAndroidHostTest
          :mediaplayer-mpv:compileAndroidMain :mediaplayer-mpv:testAndroidHostTest
          :androidApp:verifyAndroidArmNativeMatrix --no-daemon --continue

      - name: Upload Android test reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: test-reports-android
          path: |
            mediaplayer/build/reports/tests/
            mediaplayer/build/test-results/
            mediaplayer-extension-api/build/reports/tests/
            mediaplayer-extension-api/build/test-results/
            mediaplayer-ass/build/reports/tests/
            mediaplayer-ass/build/test-results/
            mediaplayer-dolbyvision/build/reports/tests/
            mediaplayer-dolbyvision/build/test-results/
            mediaplayer-kmediabridge/build/reports/tests/
            mediaplayer-kmediabridge/build/test-results/
            mediaplayer-core/build/reports/tests/
            mediaplayer-core/build/test-results/
            mediaplayer-mpv/build/reports/tests/
            mediaplayer-mpv/build/test-results/
          if-no-files-found: warn

  ios:
    needs: build-natives
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download bundled Apple ASS payloads
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: mediaplayer-ass/build/generated/
          pattern: apple-ass-${{ github.sha }}

      - name: Verify Xcode 26.3 and iOS 26 SDK
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "$DEVELOPER_DIR" ]; then
            echo "Xcode 26.3 is required by the current Compose UIKit artifacts." >&2
            exit 1
          fi
          xcodebuild -version
          sdk_version="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          echo "iOS Simulator SDK $sdk_version"
          case "$sdk_version" in
            26.*) ;;
            *) echo "An iOS 26 Simulator SDK is required." >&2; exit 1 ;;
          esac

      - name: Set up JDK 25
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          java-version: '25'
          distribution: temurin
          cache: gradle

      - name: Install the offline Metal compiler
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Compile the embedded iOS projection shader
        run: ruby .github/scripts/verify_apple_metal_shader.rb

      - name: Install Rust Apple targets
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - name: Build and test iOS Simulator
        run: >-
          ./gradlew :mediaplayer-core:compileKotlinIosArm64
          :mediaplayer-core:iosSimulatorArm64Test
          :mediaplayer-extension-api:compileKotlinIosArm64
          :mediaplayer-extension-api:iosSimulatorArm64Test
          :mediaplayer:compileKotlinIosArm64
          :mediaplayer:iosSimulatorArm64Test
          :mediaplayer-mpv:compileKotlinIosArm64
          :mediaplayer-mpv:iosSimulatorArm64Test
          :mediaplayer-ass:compileKotlinIosArm64
          :mediaplayer-ass:iosSimulatorArm64Test
          :mediaplayer-dolbyvision:compileKotlinIosArm64
          :mediaplayer-dolbyvision:iosSimulatorArm64Test
          :sample:composeApp:linkDebugFrameworkIosArm64
          :sample:composeApp:linkDebugFrameworkIosSimulatorArm64
          -PcomposeMediaPlayer.skipAssAppleNativeBuild=true
          --no-daemon --continue

      - name: Upload iOS test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: test-results-ios
          path: |
            mediaplayer/build/reports/tests/
            mediaplayer/build/test-results/
            mediaplayer-extension-api/build/reports/tests/
            mediaplayer-extension-api/build/test-results/
            mediaplayer-mpv/build/reports/tests/
            mediaplayer-mpv/build/test-results/
            mediaplayer-ass/build/reports/tests/
            mediaplayer-ass/build/test-results/
            mediaplayer-dolbyvision/build/reports/tests/
            mediaplayer-dolbyvision/build/test-results/
            mediaplayer-core/build/reports/tests/
            mediaplayer-core/build/test-results/
          if-no-files-found: warn

  wasm-js:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up JDK 25
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          java-version: '25'
          distribution: temurin
          cache: gradle

      - name: Install Rust Wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Install the WGSL validator
        run: cargo install --locked naga-cli --version 30.0.0

      - name: Validate the embedded WebGPU projection shader
        run: bash .github/scripts/verify_webgpu_wgsl.sh

      - name: Test Wasm in headless Chrome
        run: >-
          ./gradlew :mediaplayer-core:wasmJsBrowserTest
          :mediaplayer-extension-api:wasmJsBrowserTest
          :mediaplayer:wasmJsBrowserTest
          :mediaplayer-ass:wasmJsBrowserTest
          :mediaplayer-dolbyvision:wasmJsBrowserTest --no-daemon --continue

      - name: Upload Wasm test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: test-results-wasm-js
          path: |
            mediaplayer/build/reports/tests/
            mediaplayer/build/test-results/
            mediaplayer-extension-api/build/reports/tests/
            mediaplayer-extension-api/build/test-results/
            mediaplayer-ass/build/reports/tests/
            mediaplayer-ass/build/test-results/
            mediaplayer-dolbyvision/build/reports/tests/
            mediaplayer-dolbyvision/build/test-results/
            mediaplayer-core/build/reports/tests/
            mediaplayer-core/build/test-results/
          if-no-files-found: warn

  consumer:
    needs: build-natives
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download all native libraries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: mediaplayer/src/jvmMain/resources/composemediaplayer/native/
          pattern: native-*-${{ github.sha }}
          merge-multiple: true

      - name: Download all JVM libdovi libraries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: mediaplayer-dolbyvision/src/jvmMain/resources/
          pattern: libdovi-jvm-*-${{ github.sha }}
          merge-multiple: true

      - name: Download bundled Apple ASS payloads
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: mediaplayer-ass/build/generated/
          pattern: apple-ass-${{ github.sha }}

      - name: Download bundled Windows and Linux ASS payloads
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: mediaplayer-ass/build/generated/desktopAssJvmResources/
          pattern: desktop-ass-*-${{ github.sha }}
          merge-multiple: true

      - name: Set up JDK 25
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          java-version: '25'
          distribution: temurin
          cache: gradle

      - name: Publish isolated consumer fixtures
        run: >-
          ./gradlew publishConsumerSmokeArtifacts :mediaplayer:verifyJvm25Bytecode
          :mediaplayer-core:verifyJvm25Bytecode
          :mediaplayer-mpv:verifyJvm25Bytecode
          -PpublicationVersion=0.0.0-consumer.${{ github.sha }}
          -PcomposeMediaPlayer.skipNativeBuild=true
          --no-configuration-cache --no-daemon --continue

      - name: Verify Maven Central POM metadata
        run: >-
          python3 .github/scripts/verify_maven_poms.py
          build/consumer-repository
          0.0.0-consumer.${{ github.sha }}

      - name: Compile and run the isolated consumer
        run: >-
          ./gradlew consumerSmokeTest
          -PpublicationVersion=0.0.0-consumer.${{ github.sha }}
          -PcomposeMediaPlayer.skipNativeBuild=true
          --no-configuration-cache --no-daemon --continue

  quality:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Test repository helper scripts
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Set up JDK 25
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          java-version: '25'
          distribution: temurin
          cache: gradle

      - name: Check pinned libdovi shim
        run: cargo check --locked --manifest-path mediaplayer-dolbyvision/native/libdovi/Cargo.toml

      - name: Run formatting and static analysis
        run: >-
          ./gradlew :mediaplayer-core:ktlintCheck
          :mediaplayer-extension-api:ktlintCheck
          :mediaplayer:ktlintCheck :mediaplayer-mpv:ktlintCheck
          :mediaplayer-ass:ktlintCheck :mediaplayer-dolbyvision:ktlintCheck
          :mediaplayer-kmediabridge:ktlintCheck
          :mediaplayer-extension-api:detekt :mediaplayer:detekt :mediaplayer-ass:detekt
          :mediaplayer-dolbyvision:detekt :mediaplayer-kmediabridge:detekt
          verifyBackendModuleBoundaries
          -PcomposeMediaPlayer.skipNativeBuild=true --no-daemon --continue

  abi:
    needs: build-natives
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download bundled Apple ASS payloads
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: mediaplayer-ass/build/generated/
          pattern: apple-ass-${{ github.sha }}

      - name: Verify Xcode 26.3 and iOS 26 SDK
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "$DEVELOPER_DIR" ]; then
            echo "Xcode 26.3 is required to validate every published KLIB target." >&2
            exit 1
          fi
          xcodebuild -version
          sdk_version="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          echo "iOS Simulator SDK $sdk_version"
          case "$sdk_version" in
            26.*) ;;
            *) echo "An iOS 26 Simulator SDK is required." >&2; exit 1 ;;
          esac

      - name: Set up JDK 25
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          java-version: '25'
          distribution: temurin
          cache: gradle

      - name: Install libdovi ABI build targets
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim wasm32-unknown-unknown

      - name: Validate JVM and KLIB ABI on a fully supported host
        run: >-
          ./gradlew :mediaplayer-core:checkKotlinAbi
          :mediaplayer-extension-api:checkKotlinAbi
          :mediaplayer:checkKotlinAbi
          :mediaplayer-mpv:checkKotlinAbi
          :mediaplayer-ass:checkKotlinAbi
          :mediaplayer-dolbyvision:checkKotlinAbi
          :mediaplayer-kmediabridge:checkKotlinAbi
          -PcomposeMediaPlayer.skipNativeBuild=true
          -PcomposeMediaPlayer.skipMpvAppleNativeBuild=false
          -PcomposeMediaPlayer.skipLibDoviNativeBuild=false
          --no-daemon --continue

  verification-complete:
    if: always()
    needs: [jvm, android, ios, wasm-js, consumer, quality, abi]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every verification job
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          if echo "$NEEDS_JSON" | jq -e 'all(.[]; .result == "success")' >/dev/null; then
            echo "All platform, API and quality checks passed."
          else
            echo "$NEEDS_JSON" | jq .
            exit 1
          fi
