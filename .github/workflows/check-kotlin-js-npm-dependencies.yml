name: Kotlin/JS npm Dependency Check

on:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kotlin-js-npm-dependency-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check Kotlin/JS npm dependencies
        run: python3 .github/scripts/check_kotlin_js_npm_dependencies.py
