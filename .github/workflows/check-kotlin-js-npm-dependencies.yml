name: Kotlin/JS npm Dependency Check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kotlin-js-npm-dependency-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check Kotlin/JS npm dependencies
        run: python3 .github/scripts/check_kotlin_js_npm_dependencies.py
