name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kotlin-wasm:
    name: Kotlin/Wasm API, browser tests and publications
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Restore Kotlin/Wasm browser tooling
        run: ./gradlew :kotlinWasmToolingSetup --rerun-tasks --no-daemon

      - name: Test the typed Kotlin/Wasm player in Chrome
        run: ./gradlew :player:wasmJsBrowserTest --no-daemon

      - name: Verify publishable KLIB and runtime ZIP
        run: >-
          ./gradlew
          :player:verifyClosedSourcePublication
          :player:publishAllPublicationsToProjectLocalRepository
          :runtime-assets:publishAllPublicationsToProjectLocalRepository
          :runtime-assets:verifyRuntimeArchive
          --no-daemon

      - name: Verify license boundary
        run: node scripts/check-licenses.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: kmedia-wasm-engine-kotlin-wasm
          path: |
            build/project-local-repository/
            runtime-assets/build/distributions/*.zip
          if-no-files-found: error
          retention-days: 14

  browser-matrix:
    name: Kotlin/Wasm engine in ${{ matrix.browser }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: firefox
            os: ubuntu-24.04
          - browser: webkit
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Restore Kotlin/Wasm browser tooling
        run: ./gradlew :kotlinWasmToolingSetup --rerun-tasks --no-daemon

      - name: Install headless WebKit
        if: matrix.browser == 'webkit'
        run: |
          ./gradlew :kotlinWasmNpmInstall --no-daemon
          ./build/wasm/node_modules/.bin/playwright install webkit

      - name: Test the typed Kotlin/Wasm engine
        run: >-
          ./gradlew
          :player:wasmJsBrowserTest
          --no-daemon
          -PkmediaWasm.testBrowser=${{ matrix.browser }}
