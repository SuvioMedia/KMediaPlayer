name: "Automatic Deployment of Dokka Docs and Compose Example"

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

# Keep only the newest documentation deployment without blocking tagged releases.
concurrency:
  group: "documentation-pages"
  cancel-in-progress: true

jobs:
  # 1) Build Dokka Docs and the Compose Example
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Java (Temurin 25)
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      # Generate Dokka Documentation
      - name: Generate Dokka Docs
        run: |
          ./gradlew :mediaplayer:dokkaGenerateHtml

      # Build the Kotlin/Compose Example
      - name: Build Kotlin/Compose Example
        run: |
          ./gradlew :sample:composeApp:wasmJsBrowserDistribution

      # Prepare a common structure for deployment
      # Place the docs at the root and the example in /sample
      - name: Prepare files for deployment
        run: |
          mkdir -p build/final
          # Copy the docs into build/final (root of the site)
          cp -r mediaplayer/build/dokka/html/* build/final

          # Create the /sample folder in build/final
          mkdir -p build/final/sample
          cp -r sample/composeApp/build/dist/wasmJs/productionExecutable/* build/final/sample

      - name: Upload documentation site artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: documentation-site
          path: build/final
          retention-days: 1

  # 2) GitHub Pages Deployment
  deploy:
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Download documentation site artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: documentation-site
          path: build/final

      - name: Push documentation and sample to gh-pages
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          tmp_dir="$(mktemp -d)"
          pages_dir="$tmp_dir/pages"

          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages:refs/remotes/origin/gh-pages
            git worktree add "$pages_dir" origin/gh-pages
          else
            git worktree add --detach "$pages_dir"
            git -C "$pages_dir" checkout --orphan gh-pages
            git -C "$pages_dir" rm -rf . || true
          fi

          rsync -a --delete \
            --exclude='.git' \
            --exclude='maven/' \
            build/final/ "$pages_dir/"
          touch "$pages_dir/.nojekyll"

          git -C "$pages_dir" add -A .
          if git -C "$pages_dir" diff --cached --quiet; then
            echo "No documentation or sample changes to publish."
          else
            git -C "$pages_dir" commit -m "Publish documentation and sample ${GITHUB_SHA}"
            for attempt in 1 2 3; do
              if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
                git fetch origin gh-pages:refs/remotes/origin/gh-pages
                if ! git -C "$pages_dir" rebase origin/gh-pages; then
                  git -C "$pages_dir" rebase --abort
                  echo "GitHub Pages changed with a conflicting documentation update." >&2
                  exit 1
                fi
              fi
              if git -C "$pages_dir" push origin HEAD:gh-pages; then
                exit 0
              fi
              sleep $((attempt * 5))
            done
            echo "GitHub Pages documentation push failed after retries." >&2
            exit 1
          fi
