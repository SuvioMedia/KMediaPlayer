[package]
name = "composemediaplayer-libdovi"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
dolby_vision = { git = "https://github.com/quietvoid/dovi_tool", rev = "d1abe0e27ff2c7ab3339614d06db9f8a058af6b2" }
# Keep the bit-level containers identical to the pinned dovi_tool lockfile. Newer semver-compatible
# releases have changed encoded RPU output, which is unacceptable for a reproducible media shim.
bitvec = "=1.0.1"
tinyvec = "=1.11.0"

[target.'cfg(target_os = "android")'.dependencies]
jni = "=0.21.1"

[profile.release]
lto = "thin"
panic = "abort"
strip = "symbols"
